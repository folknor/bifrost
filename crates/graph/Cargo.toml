[package]
name = "bifrost-graph"
description = "Microsoft Graph client for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/folknor/bifrost"
keywords = ["email", "graph", "microsoft", "exchange"]
categories = ["email", "network-programming", "asynchronous"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base64 = "0.22"
blake3 = "1.5"
calcard = "0.3.3"
chrono = { version = "0.4", features = ["serde"] }
getrandom = { version = "0.4.2", features = ["std"] }
log = "0.4"
mail-parser = "0.11.3"
quick-xml = "0.40.1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", default-features = false, features = ["sync", "time"] }
tokio-util = "0.7"
urlencoding = "2"

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
