[package]
name = "bifrost-graph"
description = "Microsoft Graph client for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/folknor/bifrost"
keywords = ["email", "graph", "microsoft", "exchange"]
categories = ["email", "network-programming", "asynchronous"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-stream = { workspace = true }
base64 = { workspace = true }
bifrost-net = { path = "../net" }
bifrost-types = { path = "../types" }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
quick-xml = "0.40.1"
reqwest = { workspace = true, features = ["json", "native-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
