[package]
name = "bifrost-sync"
description = "Sync engine that drives bifrost-types Account implementations: scheduler, backfill, push reconciliation, mutation pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
bifrost-types = { path = "../types" }
bifrost-net = { path = "../net" }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
arc-swap = { workspace = true }

# Protocol-crate dev-deps will return in S1-W2 once the protocol
# `Account` impls have caught up with the new trait surface. During
# S1-W1 they are gone so `crates/sync/tests/cross_crate_conformance.rs`
# can compile against the trait-only stub.
#
# [dev-dependencies]
# bifrost-imap = { path = "../imap" }
# bifrost-jmap = { path = "../jmap", features = ["sync"] }
# bifrost-gmail = { path = "../gmail" }
# bifrost-graph = { path = "../graph" }
