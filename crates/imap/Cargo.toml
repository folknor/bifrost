[package]
name = "bifrost-imap"
description = "IMAP client for Rust"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/folknor/bifrost"
license.workspace = true
edition.workspace = true

keywords = ["email", "imap"]
categories = ["email", "network-programming"]

[lib]
doctest = false

[lints]
workspace = true

[features]
default = ["async-std1"]
compress = ["dep:async-compression"]

async-std1 = ["dep:async-std", "async-compression?/futures-io"]
tokio1 = ["dep:tokio", "async-compression?/tokio"]

runtime-async-std = ["async-std1"]
runtime-tokio = ["tokio1"]

[dependencies]
async-channel = "2.0.0"
async-compression = { version = "0.4.15", default-features = false, features = ["deflate"], optional = true }
async-std = { version = "1.8.0", default-features = false, features = ["std", "unstable"], optional = true }
base64 = "0.22.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3.15"
imap-proto = { path = "../imap-proto" }
log = "0.4.8"
nom = "8.0.0"
pin-project = "1"
pin-utils = "0.1.0-alpha.4"
self_cell = "1.0.1"
stop-token = "0.7"
thiserror = "2.0.18"
tokio = { version = "1", features = ["net", "sync", "time", "io-util"], optional = true }

[dev-dependencies]
async-std = { version = "1.8.0", features = ["std", "attributes"] }
pretty_assertions = "1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
