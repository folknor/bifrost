[package]
name = "bifrost-imap"
description = "IMAP client for Rust"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/folknor/bifrost"
license.workspace = true
edition.workspace = true

keywords = ["email", "imap", "async", "tokio"]
categories = ["email", "network-programming", "asynchronous"]

[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
base64 = "0.22.1"
bytes = "1"
encoding_rs = "0.8"
flate2 = "1"
getrandom = "0.2"
hmac = "0.12"
md-5 = "0.10"
native-tls = "0.2"
nom = "8.0.0"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"], optional = true }
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "time", "sync", "macros"] }
tokio-native-tls = "0.3"
tokio-util = "0.7"
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
pretty_assertions = "1.2"
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
