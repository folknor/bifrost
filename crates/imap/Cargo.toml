[package]
name = "bifrost-imap"
description = "IMAP client for Rust"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/folknor/bifrost"
license.workspace = true
edition.workspace = true

keywords = ["email", "imap", "async", "tokio"]
categories = ["email", "network-programming", "asynchronous"]

[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
encoding_rs = "0.8"
flate2 = "1"
getrandom = { workspace = true }
hmac = "0.13.0"
md-5 = "0.11.0"
native-tls = { workspace = true }
nom = { workspace = true }
pbkdf2 = "0.13.0"
serde = { workspace = true, optional = true }
sha1 = "0.11.0"
sha2 = { workspace = true }
socket2 = { workspace = true }
thiserror = "2.0.18"
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "net", "time", "sync", "macros"] }
tokio-native-tls = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }
zeroize = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.2"
proptest = "1"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
