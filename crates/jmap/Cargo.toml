[package]
name = "bifrost-jmap"
description = "JMAP client for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage = "https://github.com/folknor/bifrost"
keywords = ["jmap", "email", "mail", "e-mail"]
categories = ["email"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-stream = { workspace = true }
base64 = { workspace = true }
bifrost-net = { path = "../net" }
bifrost-types = { path = "../types", optional = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
native-tls = { workspace = true, optional = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true, features = ["stream", "native-tls"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.29.0", optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }

[features]
default = ["websockets", "mail", "calendars", "contacts", "blob", "quota"]
websockets = [
    "tokio",
    "dep:tokio-tungstenite",
    "tokio-tungstenite/native-tls",
    "dep:native-tls",
]
mail = []
calendars = []
contacts = []
blob = []
quota = []
sync = [
    "dep:bifrost-types",
    "dep:tokio-util",
    "tokio",
    "websockets",
    "mail",
    "blob",
]
debug = []

[[example]]
name = "mailboxes"
required-features = ["mail"]

[[example]]
name = "messages"
required-features = ["mail"]

[[example]]
name = "eventsource"
required-features = ["mail"]

[[example]]
name = "result_reference"
required-features = ["mail"]

[[example]]
name = "websocket"
required-features = ["websockets"]
