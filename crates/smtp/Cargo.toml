[package]
name = "bifrost-smtp"
description = "SMTP client for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true
homepage = "https://github.com/folknor/bifrost"
keywords = ["email", "smtp", "mailer", "message"]
categories = ["email", "network-programming"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
email_address = { version = "0.2.1", default-features = false }
nom = { workspace = true }
idna = "1"

bifrost-types = { path = "../types", optional = true }
bifrost-sasl = { path = "../sasl" }
bifrost-net = { path = "../net" }
getrandom = { workspace = true }

tracing = { workspace = true, features = ["std"], optional = true }

httpdate = "1"
mime = "0.3.4"
fastrand = "2.0"
quoted_printable = "0.5"
base64 = { workspace = true }
email-encoding = "0.4"

serde = { workspace = true, optional = true }

hostname = "0.4"
url = "2.4"
percent-encoding = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }

native-tls = { workspace = true }

# Not optional: the crate is async-only, and every transport it offers is a
# Tokio transport. A build without Tokio would expose no transport at all.
tokio = { workspace = true, features = [
    "rt",
    "time",
    "net",
    "io-util",
    "sync",
] }
tokio-native-tls = { workspace = true }

sha2 = { workspace = true, features = ["oid"], optional = true }
rsa = { version = "0.10.0-rc.18", optional = true }
ed25519-compact = { version = "2", optional = true }

[dev-dependencies]
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
serde_json = { workspace = true }

[features]
default = ["account-error"]

account-error = ["dep:bifrost-types"]

dkim = ["dep:sha2", "dep:rsa", "dep:ed25519-compact"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
