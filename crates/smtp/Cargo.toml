[package]
name = "bifrost-smtp"
description = "SMTP client for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true
homepage = "https://github.com/folknor/bifrost"
keywords = ["email", "smtp", "mailer", "message", "sendmail"]
categories = ["email", "network-programming"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
email_address = { version = "0.2.1", default-features = false }
nom = "8"
idna = "1"

tracing = { version = "0.1.16", default-features = false, features = ["std"], optional = true }

httpdate = { version = "1", optional = true }
mime = { version = "0.3.4", optional = true }
fastrand = { version = "2.0", optional = true }
quoted_printable = { version = "0.5", optional = true }
base64 = { version = "0.22", optional = true }
email-encoding = { version = "0.4", optional = true }

uuid = { version = "1", features = ["v4"], optional = true }
serde = { version = "1.0.110", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

hostname = { version = "0.4", optional = true }
socket2 = { version = "0.6", optional = true }
url = { version = "2.4", optional = true }
percent-encoding = { version = "2.3", optional = true }
zeroize = { version = "1", features = ["serde"], optional = true }

native-tls = { version = "0.2.9", optional = true }

tokio = { version = "1", optional = true }
tokio-native-tls = { version = "0.3", optional = true }

sha2 = { version = "0.10", features = ["oid"], optional = true }
rsa = { version = "0.9", optional = true }
ed25519-dalek = { version = "2", optional = true }

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.8.2"
tracing = { version = "0.1.16", default-features = false, features = ["std"] }
tracing-subscriber = "0.3"
glob = "0.3"
walkdir = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
maud = "0.27"

[[bench]]
harness = false
name = "transport_smtp"
required-features = ["smtp-transport", "builder"]

[[bench]]
harness = false
name = "mailbox_parsing"
required-features = ["builder"]

[features]
default = ["smtp-transport", "pool", "native-tls", "hostname", "builder"]
builder = ["dep:httpdate", "dep:mime", "dep:fastrand", "dep:quoted_printable", "dep:email-encoding"]

file-transport = ["dep:uuid", "tokio?/fs", "tokio?/io-util"]
file-transport-envelope = ["serde", "dep:serde_json", "file-transport"]
sendmail-transport = ["tokio?/process", "tokio?/io-util"]
smtp-transport = ["dep:base64", "dep:socket2", "dep:url", "dep:percent-encoding", "dep:zeroize", "tokio?/rt", "tokio?/time", "tokio?/net", "tokio?/io-util"]

pool = ["tokio?/sync"]

tls-native = ["native-tls"]

tokio = ["dep:tokio", "native-tls", "dep:tokio-native-tls"]

dkim = ["dep:base64", "dep:sha2", "dep:rsa", "dep:ed25519-dalek"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "autoconfigure"
required-features = ["smtp-transport", "native-tls"]

[[example]]
name = "basic_html"
required-features = ["file-transport", "builder"]

[[example]]
name = "maud_html"
required-features = ["file-transport", "builder"]

[[example]]
name = "smtp"
required-features = ["smtp-transport", "builder"]

[[example]]
name = "lmtp"
required-features = ["smtp-transport", "builder"]

[[example]]
name = "smtp_tls"
required-features = ["smtp-transport", "native-tls", "builder"]

[[example]]
name = "smtp_starttls"
required-features = ["smtp-transport", "native-tls", "builder"]

[[example]]
name = "smtp_selfsigned"
required-features = ["smtp-transport", "native-tls", "builder"]

[[example]]
name = "tokio_smtp_tls"
required-features = ["smtp-transport", "tokio", "builder"]

[[example]]
name = "tokio_smtp_starttls"
required-features = ["smtp-transport", "tokio", "builder"]
