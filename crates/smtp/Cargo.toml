[package]
name = "bifrost-smtp"
description = "SMTP client for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true
homepage = "https://github.com/folknor/bifrost"
keywords = ["email", "smtp", "mailer", "message"]
categories = ["email", "network-programming"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
email_address = { version = "0.2.1", default-features = false }
nom = "8"
idna = "1"

tracing = { version = "0.1.16", default-features = false, features = ["std"], optional = true }

httpdate = "1"
mime = "0.3.4"
fastrand = "2.0"
quoted_printable = "0.5"
base64 = "0.22"
email-encoding = "0.4"

serde = { version = "1.0.110", features = ["derive"], optional = true }

hostname = "0.4"
socket2 = "0.6"
url = "2.4"
percent-encoding = "2.3"
zeroize = { version = "1", features = ["serde"] }

native-tls = "0.2.9"

tokio = { version = "1", optional = true }
tokio-native-tls = { version = "0.3", optional = true }

sha2 = { version = "0.11.0", features = ["oid"], optional = true }
rsa = { version = "0.10.0-rc.18", optional = true }
ed25519-dalek = { version = "2", optional = true }

[dev-dependencies]
tracing = { version = "0.1.16", default-features = false, features = ["std"] }
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[features]
default = []

tokio = [
    "dep:tokio",
    "tokio/rt",
    "tokio/time",
    "tokio/net",
    "tokio/io-util",
    "tokio/sync",
    "dep:tokio-native-tls",
]

dkim = ["dep:sha2", "dep:rsa", "dep:ed25519-dalek"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "autoconfigure"

[[example]]
name = "smtp"

[[example]]
name = "lmtp"

[[example]]
name = "smtp_tls"

[[example]]
name = "smtp_starttls"

[[example]]
name = "smtp_oauth2"

[[example]]
name = "smtp_selfsigned"

[[example]]
name = "tokio_smtp_tls"
required-features = ["tokio"]

[[example]]
name = "tokio_smtp_starttls"
required-features = ["tokio"]
