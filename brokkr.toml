project = "bifrost"

# bifrost-jmap uses native-tls. Two explicit sweeps cover the default and
# minimum viable feature sets:
#
#  - "default"  = the default feature set: tls-native, websockets, and
#                 every RFC feature gate (mail, calendars, contacts,
#                 blob, quota). Mirrors what consumers get out of the
#                 box.
#
#  - "minimal"  = no-default-features + tls-native. Catches lints in
#                 always-compiled code that the per-RFC #[cfg] gates
#                 would otherwise hide. Also the smallest viable build
#                 (core JMAP only, no mail / calendars / contacts).

[[check]]
name = "default"
# default features

[[check]]
name = "minimal"
no_default_features = true
features = ["tls-native"]

[test]
default_package = "bifrost-jmap"
