project = "bifrost"

# bifrost-jmap has two TLS backends (tls-rustls / tls-native) that are
# mutually exclusive, so --all-features won't compile. Two explicit
# sweeps cover the matrix:
#
#  - "default"  = the default feature set: tls-rustls, websockets, and
#                 every RFC feature gate (mail, calendars, contacts,
#                 blob, quota). Mirrors what consumers get out of the
#                 box.
#
#  - "minimal"  = no-default-features + tls-rustls. Catches lints in
#                 always-compiled code that the per-RFC #[cfg] gates
#                 would otherwise hide. Also the smallest viable build
#                 (core JMAP only, no mail / calendars / contacts).

[[check]]
name = "default"
# default features

[[check]]
name = "minimal"
no_default_features = true
features = ["tls-rustls"]

[test]
default_package = "bifrost-jmap"
